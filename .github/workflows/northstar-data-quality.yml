name: Northstar data quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      run_refresh:
        description: Run the scheduled Northstar refresh in addition to release checks
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the production release gate
        run: npm run release:check

  northstar-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate graph contracts and generated registries
        run: npm run audit:northstar
      - name: Refresh literature discovery signals
        run: npm run refresh:discovery-queue
      - name: Archive refreshed discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: missing-link-discovery-${{ github.run_id }}
          path: |
            public/missing-link-literature-intake.json
            public/missing-link-discovery-queue.json
