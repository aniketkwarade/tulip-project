name: Northstar data quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate graph contracts and generated registries
        run: npm run audit:northstar
      - name: Build production application
        run: npm run build
      - name: Refresh literature discovery signals
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run refresh:discovery-queue
      - name: Archive refreshed discovery artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: missing-link-discovery-${{ github.run_id }}
          path: |
            public/missing-link-literature-intake.json
            public/missing-link-discovery-queue.json
