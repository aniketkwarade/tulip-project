<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tulip Earth" />
    <link rel="preload" as="image" href="/assets/app-icon/tulip-earth-loading.png?v=20260920-glow" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/app-icon/tulip-icon-192.png?v=20260813-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/app-icon/tulip-icon-180.png?v=20260813-1" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260813-1" />
    <title>Tulip Earth</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #000; }
      #tulip-startup-shell { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #000; }
      .tulip-native-app #tulip-startup-shell { display: none !important; }
      #tulip-startup-shell img { width: clamp(84px,24vw,104px); height: auto; border-radius: 23%; will-change: transform,filter; animation: tulip-initial-breath 3000ms cubic-bezier(.45,0,.55,1) 1 both; }
      @keyframes tulip-initial-breath {
        0%,100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(.9); filter: brightness(.7); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tulip-startup-shell img { animation: none; filter: brightness(1); }
      }
    </style>
  </head>
  <body>
    <div id="tulip-startup-shell" role="status" aria-label="Preparing Tulip Earth">
      <img src="/assets/app-icon/tulip-earth-loading.png?v=20260920-glow" alt="" aria-hidden="true" width="320" height="320" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
